    <path class="branch" d="M 1557 536 L 1557 559"/>
    <rect class="card c4" x="1375" y="559" width="365" height="88" rx="16"/><text class="code" x="1397" y="587">1.4.2</text><text class="cardTitle" x="1557" y="611" text-anchor="middle">Documentação final</text><text class="cardSub" x="1557" y="634" text-anchor="middle">uso, operação e decisões</text>
    <path class="branch" d="M 1557 647 L 1557 670"/>
    <rect class="card c4" x="1375" y="670" width="365" height="88" rx="16"/><text class="code" x="1397" y="698">1.4.3</text><text class="cardTitle" x="1557" y="722" text-anchor="middle">Avaliação do projeto</text><text class="cardSub" x="1557" y="745" text-anchor="middle">planejado × realizado</text>
