<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">EAP do projeto AnatoQuizUp 2026.2</title>
  <desc id="desc">Diagrama hierárquico e sequencial com iniciação, planejamento, execução e encerramento, incluindo seus pacotes de trabalho.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    .bg{fill:#f8fafc}.root{fill:#083344}.phase{filter:url(#shadow)}.p1{fill:#0f766e}.p2{fill:#2563eb}.p3{fill:#7c3aed}.p4{fill:#be185d}.card{fill:#fff;stroke-width:3}.c1{stroke:#5eead4}.c2{stroke:#93c5fd}.c3{stroke:#c4b5fd}.c4{stroke:#f9a8d4}.release{fill:#f5f3ff;stroke:#8b5cf6}.line{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.branch{fill:none;stroke:#94a3b8;stroke-width:3;marker-end:url(#arrow)}.heading{fill:#0f172a;font:700 38px Arial,sans-serif}.subheading{fill:#475569;font:400 21px Arial,sans-serif}.rootText{fill:#fff;font:700 34px Arial,sans-serif}.rootSub{fill:#cffafe;font:400 19px Arial,sans-serif}.phaseTitle{fill:#fff;font:700 25px Arial,sans-serif}.phaseSub{fill:#e2e8f0;font:400 17px Arial,sans-serif}.code{fill:#475569;font:700 16px Arial,sans-serif}.cardTitle{fill:#0f172a;font:700 19px Arial,sans-serif}.cardSub{fill:#475569;font:400 15px Arial,sans-serif}.legend{fill:#334155;font:400 17px Arial,sans-serif}
  </style>
  <rect class="bg" width="1800" height="1250"/>
  <text class="heading" x="900" y="54" text-anchor="middle">EAP do AnatoQuizUp 2026.2</text>
  <text class="subheading" x="900" y="88" text-anchor="middle">Fluxo do projeto e pacotes de trabalho verificáveis</text>

  <rect class="root" x="650" y="120" width="500" height="105" rx="24" filter="url(#shadow)"/>
  <text class="rootText" x="900" y="165" text-anchor="middle">1.0 Projeto AnatoQuizUp</text>
  <text class="rootSub" x="900" y="198" text-anchor="middle">Escopo total do semestre 2026.2</text>

