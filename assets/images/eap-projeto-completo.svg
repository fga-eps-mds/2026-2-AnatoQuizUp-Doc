    <path class="branch" d="M 240 869 L 240 892"/>
    <rect class="card c1" x="60" y="892" width="360" height="88" rx="16"/><text class="code" x="82" y="920">1.1.5</text><text class="cardTitle" x="240" y="944" text-anchor="middle">Organização da equipe</text><text class="cardSub" x="240" y="967" text-anchor="middle">repositórios e políticas de colaboração</text>
  </g>

