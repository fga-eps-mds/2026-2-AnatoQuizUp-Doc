  <path class="line" d="M 420 355 L 515 355"/>
  <path class="line" d="M 850 355 L 945 355"/>
  <path class="line" d="M 1280 355 L 1375 355"/>

  <rect class="phase p1" x="60" y="305" width="360" height="100" rx="20"/>
  <text class="phaseTitle" x="240" y="348" text-anchor="middle">1.1 Iniciação</text>
  <text class="phaseSub" x="240" y="378" text-anchor="middle">entender o problema e alinhar a visão</text>

  <rect class="phase p2" x="515" y="305" width="335" height="100" rx="20"/>
