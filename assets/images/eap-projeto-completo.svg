    <path class="branch" d="M 1112 687 L 1112 716"/>
    <rect class="card release" x="945" y="716" width="335" height="105" rx="16"/><text class="code" x="967" y="744">1.3.3</text><text class="cardTitle" x="1112" y="772" text-anchor="middle">Release 3 · 30/11</text><text class="cardSub" x="1112" y="798" text-anchor="middle">IA, OSCE e prática clínica</text>
    <path class="branch" d="M 1112 821 L 1112 850"/>
    <rect class="card c3" x="945" y="850" width="335" height="105" rx="16"/><text class="code" x="967" y="878">1.3.4</text><text class="cardTitle" x="1112" y="906" text-anchor="middle">Qualidade contínua</text><text class="cardSub" x="1112" y="932" text-anchor="middle">CI/CD, testes, segurança e métricas</text>
