<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Ondas do sequenciador e Releases do AnatoQuizUp</title>
  <desc id="desc">Diagrama com cinco ondas da Lean Inception conectadas às Releases 1, 2 e 3 do projeto.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  </defs>
  <style>
    .bg{fill:#f8fafc}.heading{fill:#0f172a;font:700 38px Arial,sans-serif}.subheading{fill:#475569;font:400 21px Arial,sans-serif}.section{fill:#0f172a;font:700 24px Arial,sans-serif}.wave{stroke-width:3;filter:url(#shadow)}.w1{fill:#ecfeff;stroke:#0891b2}.w2{fill:#f0fdfa;stroke:#0f766e}.w3{fill:#f5f3ff;stroke:#7c3aed}.w4{fill:#fff7ed;stroke:#ea580c}.w5{fill:#fdf2f8;stroke:#be185d}.waveTitle{fill:#0f172a;font:700 23px Arial,sans-serif}.waveSub{fill:#334155;font:400 16px Arial,sans-serif}.arrow{fill:none;stroke:#64748b;stroke-width:4;marker-end:url(#arrow)}.map{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrowBlue)}.release{fill:#fff;stroke:#94a3b8;stroke-width:3;filter:url(#shadow)}.r1{stroke:#ea580c}.r2{stroke:#7c3aed}.r3{stroke:#0e7490}.releaseTitle{fill:#0f172a;font:700 25px Arial,sans-serif}.date{fill:#475569;font:700 16px Arial,sans-serif}.item{fill:#334155;font:400 17px Arial,sans-serif}.exception{fill:#b45309;font:700 15px Arial,sans-serif}.result{fill:#083344}.resultTitle{fill:#fff;font:700 25px Arial,sans-serif}.resultSub{fill:#cffafe;font:400 18px Arial,sans-serif}.note{fill:#334155;font:400 17px Arial,sans-serif}
  </style>
  <rect class="bg" width="1800" height="1320"/>
  <text class="heading" x="900" y="55" text-anchor="middle">Ondas do sequenciador → Releases</text>
  <text class="subheading" x="900" y="90" text-anchor="middle">Do valor priorizado no FigJam à integração, aos testes e à validação de cada entrega</text>

  <text class="section" x="70" y="145">1. Ondas coletadas do FigJam</text>

  <rect class="wave w1" x="40" y="180" width="315" height="315" rx="22"/>
  <text class="waveTitle" x="197" y="222" text-anchor="middle">Onda 1</text>
  <text class="waveSub" x="70" y="267"><tspan x="70" dy="0">• Itens potencializadores</tspan><tspan x="70" dy="31">  da loja</tspan><tspan x="70" dy="38">• Criar e personalizar</tspan><tspan x="70" dy="31">  avatar</tspan><tspan x="70" dy="38">• Pontos de experiência</tspan><tspan x="70" dy="31">  (XP)</tspan></text>

  <rect class="wave w2" x="390" y="180" width="315" height="315" rx="22"/>
  <text class="waveTitle" x="547" y="222" text-anchor="middle">Onda 2</text>
  <text class="waveSub" x="420" y="267"><tspan x="420" dy="0">• Moedas por atividades</tspan><tspan x="420" dy="31">  concluídas</tspan><tspan x="420" dy="38">• Ranking de pontos</tspan><tspan x="420" dy="38">• Missões diárias, semanais</tspan><tspan x="420" dy="31">  e mensais</tspan></text>

  <rect class="wave w3" x="740" y="180" width="315" height="315" rx="22"/>
  <text class="waveTitle" x="897" y="222" text-anchor="middle">Onda 3</text>
  <text class="waveSub" x="770" y="267"><tspan x="770" dy="0">• Criar quizzes e alimentar</tspan><tspan x="770" dy="31">  o banco com apoio de IA</tspan><tspan x="770" dy="38">• Criar listas de quizzes</tspan><tspan x="770" dy="38">• Criar casos clínicos OSCE</tspan><tspan x="770" dy="31">  com chatbot</tspan></text>

  <rect class="wave w4" x="1090" y="180" width="315" height="315" rx="22"/>
  <text class="waveTitle" x="1247" y="222" text-anchor="middle">Onda 4</text>
  <text class="waveSub" x="1120" y="267"><tspan x="1120" dy="0">• Verificar resultados</tspan><tspan x="1120" dy="31">  das listas</tspan><tspan x="1120" dy="38">• Relatório com métricas</tspan><tspan x="1120" dy="31">  dos estudantes</tspan><tspan x="1120" dy="38">• Novos itens para o avatar</tspan></text>

  <rect class="wave w5" x="1440" y="180" width="315" height="315" rx="22"/>
  <text class="waveTitle" x="1597" y="222" text-anchor="middle">Onda 5</text>
  <text class="waveSub" x="1470" y="282"><tspan x="1470" dy="0">• Gerar questões com</tspan><tspan x="1470" dy="31">  imagens</tspan><tspan x="1470" dy="48">• Submeter conteúdo à</tspan><tspan x="1470" dy="31">  validação humana</tspan><tspan x="1470" dy="48">• Publicar conteúdo</tspan><tspan x="1470" dy="31">  aprovado</tspan></text>

  <path class="arrow" d="M 355 337 L 390 337"/><path class="arrow" d="M 705 337 L 740 337"/><path class="arrow" d="M 1055 337 L 1090 337"/><path class="arrow" d="M 1405 337 L 1440 337"/>

  <path class="map" d="M 197 495 C 197 560, 300 570, 340 640"/>
  <path class="map" d="M 547 495 C 547 565, 820 555, 850 640"/>
  <path class="map" d="M 1247 495 C 1247 570, 930 555, 900 640"/>
  <path class="map" d="M 897 495 C 897 560, 1420 550, 1440 640"/>
  <path class="map" d="M 1597 495 L 1597 640"/>
  <rect x="55" y="535" width="445" height="55" rx="14" fill="#f8fafc"/>
  <text class="section" x="70" y="571">2. Seleção e validação das Releases</text>

  <rect class="release r1" x="90" y="640" width="500" height="330" rx="24"/>
  <text class="releaseTitle" x="340" y="690" text-anchor="middle">Release 1</text>
  <text class="date" x="340" y="720" text-anchor="middle">28/09 · identidade e loja</text>
  <text class="item" x="130" y="766"><tspan x="130" dy="0">• Avatar e personalização</tspan><tspan x="130" dy="38">• Loja, inventário e itens</tspan><tspan x="130" dy="38">• Potencializadores</tspan><tspan x="130" dy="38">• Integração Web, BFF e serviços</tspan><tspan x="130" dy="38">• Testes e validação da entrega</tspan></text>
  <text class="exception" x="340" y="940" text-anchor="middle">XP da Onda 1 foi repriorizado para a Release 2</text>

  <rect class="release r2" x="650" y="640" width="500" height="330" rx="24"/>
  <text class="releaseTitle" x="900" y="690" text-anchor="middle">Release 2</text>
  <text class="date" x="900" y="720" text-anchor="middle">26/10 · engajamento e acompanhamento</text>
  <text class="item" x="690" y="766"><tspan x="690" dy="0">• XP, moedas, missões e ranking</tspan><tspan x="690" dy="38">• Quizzes e listas para turmas</tspan><tspan x="690" dy="38">• Resultados e métricas</tspan><tspan x="690" dy="38">• Novos itens para o avatar</tspan><tspan x="690" dy="38">• Integração, testes e validação</tspan></text>

  <rect class="release r3" x="1210" y="640" width="500" height="330" rx="24"/>
  <text class="releaseTitle" x="1460" y="690" text-anchor="middle">Release 3</text>
  <text class="date" x="1460" y="720" text-anchor="middle">30/11 · IA e prática clínica</text>
  <text class="item" x="1250" y="766"><tspan x="1250" dy="0">• Questões e imagens com apoio de IA</tspan><tspan x="1250" dy="38">• Chatbot de apoio aos estudos</tspan><tspan x="1250" dy="38">• Casos clínicos OSCE</tspan><tspan x="1250" dy="38">• Paciente virtual e simulação</tspan><tspan x="1250" dy="38">• Curadoria humana e validação</tspan></text>

  <path class="arrow" d="M 340 970 C 340 1035, 690 1030, 775 1075"/><path class="arrow" d="M 900 970 L 900 1075"/><path class="arrow" d="M 1460 970 C 1460 1035, 1110 1030, 1025 1075"/>
  <rect class="result" x="400" y="1075" width="1000" height="160" rx="24" filter="url(#shadow)"/>
  <text class="resultTitle" x="900" y="1120" text-anchor="middle">Resultado integrado do projeto</text>
  <text class="resultSub" x="900" y="1157" text-anchor="middle">Cada Release reúne escopo, integração, testes, demonstração e aceite.</text>
  <text class="resultSub" x="900" y="1187" text-anchor="middle">A distribuição final é atualizada no backlog e no roadmap</text>
  <text class="resultSub" x="900" y="1215" text-anchor="middle">após a validação com os Product Owners.</text>

  <rect x="90" y="1250" width="1620" height="45" rx="16" fill="#e2e8f0"/>
  <text class="note" x="900" y="1279" text-anchor="middle">Fonte das ondas: sequenciador da Lean Inception no FigJam AnatoQuizUp 2026.2.</text>
</svg>
